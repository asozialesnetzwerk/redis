name: Build OCI images
on:
  schedule:
    - cron: "0 20 * * *"
  push:
    tags: [ v* ]
    branches: [ '6.2' ]
  pull_request:
    branches: [ '6.2' ]

jobs:

  build-oci-image:
    name: Build ${{ matrix.os.arch }} ${{ matrix.variant.distro }} OCI image
    strategy:
      matrix:
        variant:
          - distro: Debian
            containerfile: Containerfile
            tag-suffix: ''
          - distro: Alpine
            containerfile: alpine.Containerfile
            tag-suffix: -alpine
        os:
          - label: ubuntu-26.04
            arch: x86_64
          - label: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os.label }}
    permissions:
      packages: write
    steps:
      - name: Download youki
        run: |
          wget "https://github.com/youki-dev/youki/releases/download/v${VERSION}/youki-${VERSION}-${{ matrix.os.arch }}-musl.tar.gz"
          tar xOf "youki-${VERSION}-${{ matrix.os.arch }}-musl.tar.gz" youki > /opt/youki
          rm -f "youki-${VERSION}-${{ matrix.os.arch }}-musl.tar.gz"
          chmod +x /opt/youki
        env:
          VERSION: 0.6.0
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Build image
        run: |
          sudo buildah build --runtime /opt/youki -f "${{ matrix.variant.containerfile }}" -t redis
          sudo buildah inspect redis
      - name: Save image
        run: sudo buildah push --all --format=oci --compression-format=zstd:chunked --compression-level=20 redis "oci-archive:oci-archive-${{ matrix.os.arch }}.tar"
      - name: Upload as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant.variant }}-oci-image-${{ matrix.os.arch }}
          path: oci-archive-${{ matrix.os.arch }}.tar

  combine-oci-images:
    name: Combine ${{ matrix.variant.distro }} OCI images
    runs-on: ubuntu-26.04
    needs:
      - build-oci-image
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - distro: Debian
            containerfile: Containerfile
            tag-suffix: ''
          - distro: Alpine
            containerfile: alpine.Containerfile
            tag-suffix: -alpine
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.variant.variant }}-oci-image-*
          merge-multiple: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Create manifest with annotations
        shell: python
        run: |
          import json, subprocess, sys

          def run(command: list[str]) -> str:
            print("+", *command, file=sys.stderr, flush=True)
            return subprocess.run(command, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()

          image = run(["sudo", "buildah", "pull", "oci-archive:oci-archive-x86_64.tar"])

          manifest = json.loads(run(["sudo", "buildah", "inspect", image]))

          annotations = []

          for (key, value) in manifest["ImageAnnotations"].items():
            if not key.startswith("org.opencontainers.image."):
              continue
            if key == "org.opencontainers.image.base.digest":
              continue
            annotations.extend(["--annotation", f"{key}={value}"])

          print(run(["sudo", "buildah", "manifest", "create", *annotations, "redis"]))
      - name: Add images to manifest
        run: |
          set -x
          for file in oci-archive-*
          do
            sudo buildah pull "oci-archive:$file"
            sudo buildah manifest add redis "oci-archive:$file"
          done
      - name: Push manifest
        run: sudo buildah manifest push --compression-level 20 --add-compression zstd:chunked --compression-format zstd:chunked --all redis "oci-archive:oci-archive.tar"
      - name: Upload as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: oci-image${{ matrix.variant.tag-suffix }}
          path: oci-archive.tar

  push-oci-image:
    name: Push ${{ matrix.variant.distro }} OCI image
    runs-on: ubuntu-26.04
    needs:
      - combine-oci-images
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - distro: Debian
            containerfile: Containerfile
            tag-suffix: ''
          - distro: Alpine
            containerfile: alpine.Containerfile
            tag-suffix: -alpine
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: oci-image${{ matrix.variant.tag-suffix }}
      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io/${{ github.repository }}
      - name: Push image to ghcr.io as latest
        run: skopeo copy --all --preserve-digests oci-archive:oci-archive.tar docker://ghcr.io/${{ github.repository }}:latest${{ matrix.variant.tag-suffix }}
